# Barnacle, ported from openclaw/openclaw .github/workflows/auto-response.yml
# (see vendor/openclaw/). Repos call this with templates/barnacle-caller.yml.
# Identity: the private arc-forge-barnacle GitHub App (org secret
# BARNACLE_APP_PRIVATE_KEY, org variable BARNACLE_APP_ID).
name: Barnacle

on:
  workflow_call:
    secrets:
      BARNACLE_APP_PRIVATE_KEY:
        required: true

permissions: {}

jobs:
  auto-response:
    # Upstream's gate: skip members/collaborators, bot comments, no-op edits,
    # and ClawSweeper's own label events. Arc Forge exception: the
    # r: not-in-vision label event always runs, so run.mjs can close team-authored
    # off-vision work (it still checks the labeller has write access).
    if: >-
      ${{ (
        (
          !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association || github.event.pull_request.author_association) ||
          (github.event.action == 'labeled' && github.event.label.name == 'r: not-in-vision')
        ) &&
        (github.event_name != 'issue_comment' || github.event.comment.user.type != 'Bot') &&
        (github.event.action != 'edited' || !github.event.changes ||
          github.event.changes.title || github.event.changes.body || github.event.changes.base) &&
        (
          github.event_name != 'pull_request_target' ||
          (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
          (github.actor != 'arc-forge-clawsweeper[bot]' && github.actor != 'arc-forge-clawsweeper-review[bot]')
        )
      ) }}
    concurrency:
      group: barnacle-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: ${{ github.event_name == 'pull_request_target' && github.event.action == 'synchronize' }}
    permissions: {}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: ${{ vars.BARNACLE_APP_ID }}
          private-key: ${{ secrets.BARNACLE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }},.github
          permission-contents: read
          permission-issues: write
          permission-members: read
          permission-metadata: read
          permission-pull-requests: write
      # Trusted code only: this repo at the exact commit the caller pinned.
      # Untrusted PR code is never checked out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - name: Apply PR cap label
        if: ${{ github.event_name == 'pull_request_target' && github.event.action != 'edited' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { pathToFileURL } = require("node:url");
            const { runPrCap } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/barnacle/run.mjs`).href);
            await runPrCap({ github, context, core });
      - name: Run Barnacle auto-response
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { pathToFileURL } = require("node:url");
            const { run } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/barnacle/run.mjs`).href);
            await run({ github, context, core });
